
<section>
<div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default m-4">
  <table class="w-full text-sm text-left rtl:text-right text-body bg-yellow-700">
    <thead class="text-sm text-body bg-yellow-700 border-b rounded-base border-default" style="color: #000000;">
      <tr>
       <th scope="col" class="px-6 py-3 font-medium">Id</th>
        <th scope="col" class="px-6 py-3 font-medium">Línea</th>
        <th scope="col" class="px-6 py-3 font-medium">Modelo</th>
        <th scope="col" class="px-6 py-3 font-medium">Estilo</th>
        <th scope="col" class="px-6 py-3 font-medium">Proceso</th>
        <th scope="col" class="px-6 py-3 font-medium">Tiempo Estándar (min)</th>
    </thead>
    <tbody>
      @for (plan of listaPlantilla; track plan.id) {
        <tr class="bg-neutral-primary border-b border-default">
          <th scope="row" class="px-6 py-4 font-medium text-heading whitespace-nowrap">
            {{ plan.id }}
          </th>
          <td class="px-6 py-4">{{ plan.linea }}</td>
          <td class="px-6 py-4">{{ plan.modelo }}</td>
          <td class="px-6 py-4">{{ plan.estilo }}</td>
          <td class="px-6 py-4">{{ plan.proceso }}</td>
          <td class="px-6 py-4">{{ plan.tiempoStdMin }}</td>
        </tr>
      } @empty {
                <tr>
                    <td colspan="7" class="px-6 py-4 text-center">
                        No se encontraron registros de Modelos Pespunte.
                    </td>
                </tr>
              }
    </tbody>
  </table>
</div>
</section>
