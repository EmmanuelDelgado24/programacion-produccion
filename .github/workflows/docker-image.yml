name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Git Semantic Version
      uses: PaulHatch/semantic-version@v6.0.2
      with:
         major_pattern: "major:"
         minor_pattern: "feat:"
         format: "${major}.${minor}.${patch}-prerelease${increment}"
      id: version
     
    - name: Docker login
      if: github.event_name == 'push'
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
        echo "New version: $NEW_VERSION!!!!"
          
    - name: Build Docker Image
      run: |
        docker build -t emmanueldelgado2412/programacion:v1.0.1 \
          -f Servidor/api/Dockerfile Servidor/api
        docker build -t emmanueldelgado2412/programacion:latest  \
          -f Servidor/api/Dockerfile Servidor/api

    - name: Push Docker Image
      if: github.event_name == 'push'
      run: |
        docker push emmanueldelgado2412/programacion:v1.0.1
        docker push emmanueldelgado2412/programacion:latest
      
      
        

    
